<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Industrial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#0a1423;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.dashboard{
    width:1300px;
    background:linear-gradient(180deg,#102844 0%,#0b1e35 100%);
    border-radius:30px;
    padding:30px;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,0.45);
}

.top{
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:linear-gradient(180deg,#16365b 0%,#102844 100%);
    border-radius:24px;
    padding:24px;
    border:1px solid rgba(255,255,255,0.08);
}

.logo-card{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.logo{
    background:#ffd400;
    color:#d21f26;
    padding:12px 30px;
    border-radius:10px;
    font-size:42px;
    font-weight:800;
    font-style:italic;
}

.meta-title{
    font-size:42px;
    font-weight:700;
    letter-spacing:2px;
}

.card-title{
    color:#b8c6d8;
    font-size:16px;
    font-weight:600;
    margin-bottom:14px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.card-value{
    font-size:44px;
    font-weight:800;
    color:#ffd24d;
}

.green{
    color:#5dff87;
}

.main-panel{
    background:linear-gradient(180deg,#0f2742 0%,#091a2d 100%);
    border-radius:28px;
    padding:30px;
    border:1px solid rgba(255,255,255,0.08);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.panel-title{
    font-size:36px;
    font-weight:800;
}

.status{
    background:rgba(57,255,20,0.12);
    color:#66ff66;
    padding:10px 18px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 14px;
}

th{
    text-align:left;
    color:#9eb2ca;
    font-size:14px;
    font-weight:700;
    padding:0 20px;
    text-transform:uppercase;
}

td{
    background:rgba(255,255,255,0.03);
    padding:22px 20px;
    font-size:22px;
    font-weight:700;
}

tr td:first-child{
    border-top-left-radius:18px;
    border-bottom-left-radius:18px;
}

tr td:last-child{
    border-top-right-radius:18px;
    border-bottom-right-radius:18px;
    color:#5dff87;
}

.summary{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.summary-card{
    background:rgba(255,255,255,0.04);
    border-radius:22px;
    padding:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.summary-title{
    color:#b8c6d8;
    font-size:18px;
    font-weight:600;
}

.summary-desc{
    margin-top:8px;
    color:#8ea4bf;
    font-size:14px;
}

.summary-value{
    font-size:34px;
    font-weight:800;
}

.footer{
    margin-top:25px;
    text-align:right;
    color:#8ea4bf;
    font-size:12px;
}

@media(max-width:1200px){

    .top{
        grid-template-columns:1fr 1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="dashboard">

<div class="top">

<div class="card logo-card">
<div class="logo">Starrett</div>
<div class="meta-title">META</div>
</div>

<div class="card">
<div class="card-title">Valor Meta</div>
<div class="card-value" id="metaValor"></div>
</div>

<div class="card">
<div class="card-title">Linhas Meta</div>
<div class="card-value" id="metaLinha"></div>
</div>

<div class="card">
<div class="card-title">Produzido Hoje</div>
<div class="card-value green" id="valorTotalTop"></div>
</div>

</div>

<div class="main-panel">

<div class="panel-header">
<div class="panel-title">PRODUZIDO MERCADO INTERNO</div>
<div class="status">● OPERANDO</div>
</div>

<table>

<thead>
<tr>
<th>Turno</th>
<th>Linhas</th>
<th>Valor Total</th>
</tr>
</thead>

<tbody id="tabelaTurnos">
</tbody>

</table>

<div class="summary">

<div class="summary-card">

<div>
<div class="summary-title">TOTAL LINHAS</div>
<div class="summary-desc">Quantidade produzida total</div>
</div>

<div class="summary-value" id="totalLinhas"></div>

</div>

<div class="summary-card">

<div>
<div class="summary-title">VALOR TOTAL</div>
<div class="summary-desc">Produção acumulada</div>
</div>

<div class="summary-value green" id="valorTotal"></div>

</div>

<div class="summary-card">

<div>
<div class="summary-title">TICKET MÉDIO</div>
<div class="summary-desc">Valor médio por linha</div>
</div>

<div class="summary-value green" id="ticketMedio"></div>

</div>

</div>

<div class="footer">
Atualizado automaticamente • Dashboard Operacional
</div>

</div>

</div>

<script>

function moeda(valor){

return Number(valor).toLocaleString('pt-BR',{
style:'currency',
currency:'BRL'
})

}

fetch('dados.json?v=' + new Date().getTime())

.then(response => response.json())

.then(data => {

document.getElementById('metaValor').innerHTML = moeda(data.metaValor)

document.getElementById('metaLinha').innerHTML = Number(data.metaLinha).toLocaleString('pt-BR')

document.getElementById('valorTotalTop').innerHTML = moeda(data.valorTotal)

document.getElementById('totalLinhas').innerHTML = Number(data.totalLinhas).toLocaleString('pt-BR')

document.getElementById('valorTotal').innerHTML = moeda(data.valorTotal)

document.getElementById('ticketMedio').innerHTML = moeda(data.ticketMedio)

let html = ''

data.turnos.forEach(t => {

html += `
<tr>
<td>${t.turno}</td>
<td>${Number(t.linhas).toLocaleString('pt-BR')}</td>
<td>${moeda(t.valor)}</td>
</tr>
`

})

document.getElementById('tabelaTurnos').innerHTML = html

})

</script>

</body>
</html>
